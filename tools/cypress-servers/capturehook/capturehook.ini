[Capture]
; probe = read and log the bytes at the addresses below, install nothing (safe).
; hook  = MinHook ProtoSSLSend/Recv/Connect and dump decrypted Blaze frames.
Mode=probe
DumpDir=

[ProtoSSL]
; RVAs (offsets from the game image base). Defaults are the values from the
; EA-MITM ini; probe mode confirms whether they are real function entries in
; this build before hook mode ever writes to them.
Connect=0x016D4120
Send=0x016D4940
Recv=0x016D4830
